# Your existing configuration
spring.application.name=llm
spring.ai.openai.api-key=not-needed
spring.ai.openai.base-url=http://localhost:1234
spring.ai.openai.chat.options.model=deepseek-coder-v2-lite-instruct

# DevTools Configuration
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# IMPORTANT: Watch the target/classes directory
spring.devtools.restart.additional-paths=target/classes
spring.devtools.restart.exclude=static/**,public/**

# Enable DevTools debug logging
logging.level.org.springframework.boot.devtools=DEBUG

# JVM Arguments to suppress ByteBuddy warnings
spring.jvm.additional-args=-XX:+EnableDynamicAgentLoading