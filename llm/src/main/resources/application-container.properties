# Container-specific configuration
spring.application.name=llm-runtime-system

# AI Configuration (using host networking to reach DeepSeek)
spring.ai.openai.api-key=not-needed
spring.ai.openai.base-url=http://host.containers.internal:1234
spring.ai.openai.chat.options.model=deepseek-coder-v2-lite-instruct

# Disable DevTools in container
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Logging configuration
logging.level.com.ai.llm=INFO
logging.level.org.springframework.boot.devtools=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Server configuration
server.port=8080
server.address=0.0.0.0

# Management endpoints for monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always